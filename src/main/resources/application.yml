spring:
  application:
    name: gateway

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - ${FRONT_URL:https://yes-nhn.site}
                  - "http://localhost:8082"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true

gateway:
  upstream:
    user-url: ${USER_SERVER_URL:http://localhost:8081}
    cultivation-url: ${CULTIVATION_SERVER_URL:http://localhost:8084}
    notification-url: ${NOTIFICATION_SERVER_URL:http://localhost:8085}
    ai-url: ${AI_SERVER_URL:http://localhost:8000}

logging:
  level:
    root: ${LOG_LEVEL:INFO}


management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info