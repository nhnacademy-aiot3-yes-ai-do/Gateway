spring:
  application:
    name: gateway

  config:
    import: optional:file:.env[.properties]

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - ${FRONT_URL:https://yes-nhn.site}
                  - "http://localhost:8082"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE}

gateway:
  upstream:
    user-url: ${USER_SERVER_URL}
    cultivation-url: ${CULTIVATION_SERVER_URL}
    notification-url: ${NOTIFICATION_SERVER_URL}
    ai-url: ${AI_SERVER_URL}

# API 문서 통합 (springdoc). 각 서비스의 /v3/api-docs 를 Gateway 라우트로 프록시해
# 하나의 Swagger UI(드롭다운)에서 조회한다. 서비스가 늘면 라우트 + urls 항목을 함께 추가한다.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
    urls:
      - name: cultivation-server
        url: /v3/api-docs/cultivation

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    site.yesaido.gateway.filter.GatewayRequestResponseLoggingFilter: INFO


management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET}