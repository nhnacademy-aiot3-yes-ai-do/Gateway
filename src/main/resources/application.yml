spring:
  application:
    name: gateway

  config:
    import: optional:file:.env[.properties]

  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - ${FRONT_URL:https://yes-nhn.site}
                  - "http://localhost:8082"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowedHeaders: "*"
                allowCredentials: true

gateway:
  upstream:
    user-url: ${USER_SERVER_URL}
    cultivation-url: ${CULTIVATION_SERVER_URL}
    notification-url: ${NOTIFICATION_SERVER_URL}
    ai-url: ${AI_SERVER_URL}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    site.yesaido.gateway.filter.GatewayRequestResponseLoggingFilter: INFO


management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET}